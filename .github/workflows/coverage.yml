name: Coverage

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      mongo:
        image: mongo
        ports:
          - 27017:27017
    steps:
      # Full history feeds `git merge-base origin/<base> HEAD`; annotations are dropped
      # unless the analyzed checkout is the pull request head SHA.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Free disk space (pre-build)
        continue-on-error: true
        run: |
          echo "Freeing disk space..."
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          if command -v docker >/dev/null 2>&1; then
            timeout 60 docker image prune -af || true
          fi
          echo "Disk after:"
          df -h
      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Generate coverage and report with Badgers
        uses: devgony/badgers@53ea250d30875ac6512b4c04efd0808870307d75 # v2.4.0
        # Composite actions inherit step env, including in the merge-base rerun, so the
        # token stays out of the environment of every other step.
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        with:
          # Badgers runs this through `bash -c`, which does not inherit the errexit that
          # GitHub gives a `run:` step, so without `set -e` a failing test suite would be
          # masked by the succeeding report command. The trap drops the head build tree
          # before the merge-base rerun, which never reuses it, to halve peak disk.
          coverage-command: |
            set -euo pipefail
            trap 'cargo llvm-cov clean --workspace || true' EXIT
            mkdir -p coverage
            cargo llvm-cov clean --workspace
            cargo llvm-cov \
              --workspace \
              --all-features \
              --no-report
            rm -rf target/llvm-cov-target/debug/incremental || true
            cargo llvm-cov report \
              --lcov \
              --no-default-ignore-filename-regex \
              --ignore-filename-regex '(^|/)(pkg/rust/examples/.*|cli/src/(cli|helper|lib|main)\.rs)$' \
              --output-path ./coverage/lcov.info
          lcov-file: coverage/lcov.info
          # Dependabot branches live in this repository, so they clear the same-repo gate
          # on the storage push, but their token is read-only and that push fails the job.
          # Disabling storage also removes the baseline, hence skipping the rebuild it
          # would otherwise force. Comment and annotation failures only warn.
          # The negated form matters: `cond && '' || x` always yields x, because the empty
          # string is falsy.
          github-storage-repo: ${{ github.actor != 'dependabot[bot]' && github.repository || '' }}
          base-rebuild: ${{ github.actor == 'dependabot[bot]' && 'never' || 'auto' }}
          markdown-summary: true
      - name: Cleanup coverage build artifacts
        if: always()
        run: |
          cargo llvm-cov clean --workspace || true
          rm -rf ~/.cargo/registry ~/.cargo/git || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust
          fail_ci_if_error: true
      - name: Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to GITHUB_SHA, which is the synthetic merge commit, while the
          # coverage above is now generated from the pull request head.
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          git-branch: ${{ github.head_ref || github.ref_name }}
      - name: Compress coverage report
        run: |
          xz -T0 -9e -c coverage/lcov.info > coverage/lcov.info.xz
          rm -f coverage/lcov.info
      - name: Record PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > coverage/pr-number
      - name: Set timestamp
        run: echo "TIMESTAMP=$(date -u +'%Y-%m-%dT%H%M%SZ')" >> $GITHUB_ENV
      - name: Create GitHub App token
        if: github.repository == 'gluesql/gluesql' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COVERAGE_APP_ID }}
          installation-id: ${{ secrets.COVERAGE_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: gluesql
          repositories: gluesql, gluesql.github.io
      - name: Publish coverage to gluesql.github.io
        if: github.repository == 'gluesql/gluesql' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git clone https://github.com/gluesql/gluesql.github.io.git
          cd gluesql.github.io
          git checkout gh-pages
          mkdir -p coverage/main
          cp ../coverage/lcov.info.xz coverage/main/${TIMESTAMP}.${COMMIT_SHA}.lcov.info.xz
          git add coverage/main/${TIMESTAMP}.${COMMIT_SHA}.lcov.info.xz
          git commit -m "Coverage: main@${COMMIT_SHA}"
          git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/gluesql/gluesql.github.io.git
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
