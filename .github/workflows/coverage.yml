name: Coverage

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      mongo:
        image: mongo
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (pre-build)
        continue-on-error: true
        run: |
          echo "Freeing disk space..."
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          if command -v docker >/dev/null 2>&1; then
            timeout 60 docker image prune -af || true
          fi
          echo "Disk after:"
          df -h
      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Prepare coverage directory
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
      - name: Generate coverage data
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          cargo llvm-cov \
            --workspace \
            --all-features \
            --no-report
      - name: Free disk space before coverage report
        run: |
          echo "Removing incremental build artifacts to free space..."
          rm -rf target/llvm-cov-target/debug/incremental || true
      - name: Generate LCOV report
        run: |
          cargo llvm-cov report \
            --lcov \
            --no-default-ignore-filename-regex \
            --ignore-filename-regex '(^|/)(pkg/rust/examples/.*|cli/src/(cli|helper|lib|main)\.rs)$' \
            --output-path ./coverage/lcov.info
      - name: Cleanup coverage build artifacts
        if: always()
        run: |
          cargo llvm-cov clean --workspace || true
          rm -rf ~/.cargo/registry ~/.cargo/git || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust
          fail_ci_if_error: true
      - name: Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
