name: Coverage (Badgers)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  badgers:
    # Dependabot branches live in this repository, so they clear the same-repo gate that
    # Badgers puts on every publish step, but their token is read-only and the push fails.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: write
    # Job level, so the merge-base rerun in a separate worktree sees it too.
    env:
      GIT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      mongo:
        image: mongo
        ports:
          - 27017:27017
    steps:
      # Full history feeds `git merge-base origin/<base> HEAD`; annotations are dropped
      # unless the analyzed checkout is the pull request head SHA.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Free disk space (pre-build)
        continue-on-error: true
        run: |
          echo "Freeing disk space..."
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          if command -v docker >/dev/null 2>&1; then
            timeout 60 docker image prune -af || true
          fi
          echo "Disk after:"
          df -h
      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      # Secrets are withheld from forked pull requests, so this cannot run there. Badgers
      # then falls back to github-token and skips the deploy, which forks cannot do anyway.
      - name: Create GitHub App token
        id: app-token
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COVERAGE_APP_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: gluesql
          repositories: gluesql.github.io
      - name: Report coverage with Badgers
        uses: devgony/badgers@53ea250d30875ac6512b4c04efd0808870307d75 # v2.4.0
        with:
          # Mirrors the legacy Coverage workflow. Badgers reruns this verbatim at the
          # merge base, and it never reuses the head build directory, so the trap drops
          # the head tree before the second build to halve peak disk.
          coverage-command: |
            trap 'cargo llvm-cov clean --workspace || true' EXIT
            mkdir -p coverage
            cargo llvm-cov clean --workspace
            cargo llvm-cov \
              --workspace \
              --all-features \
              --no-report
            rm -rf target/llvm-cov-target/debug/incremental || true
            cargo llvm-cov report \
              --lcov \
              --no-default-ignore-filename-regex \
              --ignore-filename-regex '(^|/)(pkg/rust/examples/.*|cli/src/(cli|helper|lib|main)\.rs)$' \
              --output-path ./coverage/lcov.info
          lcov-file: coverage/lcov.info
          # Pushes to main seed the baselines that spare pull requests a second build.
          github-storage-repo: ${{ github.repository }}
          # Deploying into the site that already serves gluesql.org keeps Pages disabled
          # on this repository. The prefix puts Badgers in shared mode, so it appends
          # commits and leaves the rest of that branch, including CNAME, alone.
          pages: true
          pages-repo: gluesql/gluesql.github.io
          pages-prefix: coverage/badgers
          pages-token: ${{ steps.app-token.outputs.token }}
          pages-retention: 20
          markdown-summary: true
