name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number or step to bump"
        required: true
        default: "minor"

env:
  CARGO_TERM_COLOR: always

jobs:
  bump_version:
    name: Bump versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Bump versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo release version ${{ github.event.inputs.version }} --workspace --execute --no-confirm
          NEW_VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          python3 - "${NEW_VERSION#v}" <<'PY'
          import re
          import sys
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()
          pattern = r"https://gluesql\.org/docs/(?:dev|[0-9][0-9A-Za-z.+-]*)/"
          content = re.sub(pattern, f"https://gluesql.org/docs/{sys.argv[1]}/", content)
          readme.write_text(content)
          PY

          NEW_BRANCH="prepare-release-$NEW_VERSION"
          git checkout -b $NEW_BRANCH
          git config --local user.email "taehoon.moon@outlook.com"
          git config --local user.name "Taehoon Moon"
          git add .
          git commit -m "Bump version to $NEW_VERSION"
          git push origin $NEW_BRANCH
          gh pr create --draft --title "Prepare release $NEW_VERSION" --body "Prepare release $NEW_VERSION" --repo $GITHUB_REPOSITORY
