[package]
name = "gluesql-core"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:gluesql-macros"]

[dependencies]
regex = "1"
gluesql-macros = { path = "../macros", version = "0.20.0", optional = true }
cfg-if = "1"
chrono = { version = "0.4.38", features = ["serde", "wasmbind"] }
rust_decimal = { version = "1", features = ["serde-str"] }
im = "15"
iter-enum = "1"
itertools = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.52", features = ["serde", "bigdecimal"] }
thiserror = "1.0"
strum_macros = "0.25"
bigdecimal = { version = "0.4.10", features = ["serde", "string-only"] }
hex = "0.4"
rand = "0.8"
ordered-float = { version = "4", features = ["serde"] }
md-5 = "0.10.5"
tracing = { version = "0.1", optional = true, default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies.uuid]
version = "1"
features = ["v4", "js"]
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.uuid]
version = "1"
features = ["v4"]

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
